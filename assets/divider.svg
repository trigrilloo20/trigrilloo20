<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="8" viewBox="0 0 1200 8" fill="none" preserveAspectRatio="none" role="img" aria-label="divider">
  <defs>
    <linearGradient id="dg" x1="0" y1="4" x2="1200" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.8" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes hue { 0%{transform:scaleX(0.6);opacity:.7} 50%{transform:scaleX(1);opacity:1} 100%{transform:scaleX(0.6);opacity:.7} }
      .bar { animation: hue 5s ease-in-out infinite; transform-origin:center; }
    </style>
  </defs>
  <rect class="bar" x="100" y="2.5" width="1000" height="3" rx="1.5" fill="url(#dg)"/>
</svg>
